<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Import PoC</title>
</head>
<body>
  <h1>Excel Import PoC</h1>

  <form id="upload-form">
    <input type="file" id="file-input" name="file" accept=".xlsx" required />
    <button type="submit">Upload</button>
  </form>

  <p id="status"></p>
  <div id="results"></div>

  <script>
    const form = document.getElementById("upload-form");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      // Clear previous results and status
      statusEl.textContent = "";
      resultsEl.innerHTML = "";

      const fileInput = document.getElementById("file-input");
      const file = fileInput.files[0];

      if (!file) {
        statusEl.textContent = "Please select a file.";
        return;
      }

      // Build FormData with the field name the server expects ("file")
      const formData = new FormData();
      formData.append("file", file);

      statusEl.textContent = "Uploading…";

      try {
        // POST to /api/upload — do NOT set Content-Type manually
        // (the browser must add the multipart boundary string itself)
        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();

        if (!response.ok) {
          // Server returned an error — display its message
          statusEl.textContent = "Error: " + (data.error || "Unknown error");
          return;
        }

        // Success
        statusEl.textContent =
          "Uploaded: " + data.filename + " — " + data.sheets.length + " sheet(s)";
        renderSheets(data);
      } catch (err) {
        statusEl.textContent = "Network error: " + err.message;
      }
    });

    /**
     * Render one HTML table per sheet.
     * Uses textContent (not innerHTML) for cell values — prevents XSS from
     * spreadsheet cells containing HTML like <script> or <b>bold</b>.
     */
    function renderSheets(data) {
      resultsEl.innerHTML = "";

      data.sheets.forEach((sheet) => {
        // Sheet heading
        const heading = document.createElement("h2");
        heading.textContent = sheet.name;
        resultsEl.appendChild(heading);

        // Sheet metadata
        const meta = document.createElement("p");
        meta.textContent =
          sheet.rowCount + " rows × " + sheet.columnCount + " columns";
        resultsEl.appendChild(meta);

        if (sheet.rows.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "(empty sheet)";
          resultsEl.appendChild(empty);
          return;
        }

        // Build the table
        const table = document.createElement("table");
        table.border = "1";
        table.cellPadding = "4";
        table.cellSpacing = "0";

        sheet.rows.forEach((row, rowIndex) => {
          const tr = document.createElement("tr");

          row.forEach((cell) => {
            // Use <th> for the first row (likely header), <td> for data rows
            // This is a display convenience — no assumption that row 0 IS a header
            const cellEl = document.createElement(rowIndex === 0 ? "th" : "td");

            // Render null cells as empty string, not the text "null"
            // Use textContent for XSS safety
            cellEl.textContent = cell === null || cell === undefined ? "" : cell;

            tr.appendChild(cellEl);
          });

          table.appendChild(tr);
        });

        resultsEl.appendChild(table);
      });
    }
  </script>
</body>
</html>
